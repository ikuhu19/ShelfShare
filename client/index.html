<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
    <title>ShelfShare — Student Book Exchange Platform</title>
    
    <!-- Primary Meta Tags -->
    <meta name="title" content="ShelfShare — Student Book Exchange Platform" />
    <meta name="description" content="ShelfShare is a peer-to-peer campus book exchange platform enabling students to share textbooks, study materials, and knowledge sustainably." />
    <meta name="theme-color" content="#C45517" />
    <meta name="color-scheme" content="light" />

    <!-- Favicon & Touch Icons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="/icon-192.png" />

    <!-- Web App Manifest (PWA) -->
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Mobile Web App Capability -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="ShelfShare" />

    <!-- Open Graph / Social Sharing -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="ShelfShare — Campus Book Exchange" />
    <meta property="og:description" content="Browse, list, and exchange student textbooks directly on your campus." />
    <meta property="og:image" content="/icon-512.png" />
    <meta property="og:site_name" content="ShelfShare" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
