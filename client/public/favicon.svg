<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="terracottaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DE6523" />
      <stop offset="100%" stop-color="#A8420E" />
    </linearGradient>
    <filter id="subtleGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#2C1810" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- App Icon Background Container -->
  <rect width="512" height="512" rx="112" fill="url(#terracottaGrad)" />

  <!-- Inner Content Group with Shadow -->
  <g filter="url(#subtleGlow)">
    <!-- Book Spine & Pages -->
    <!-- Left Page -->
    <path d="M256 360 C210 330 140 330 96 348 L96 156 C140 138 210 138 256 168 Z" fill="#FAF7F2" />
    <!-- Right Page -->
    <path d="M256 360 C302 330 372 330 416 348 L416 156 C372 138 302 138 256 168 Z" fill="#FFFFFF" />
    
    <!-- Spine Center Line -->
    <path d="M256 168 L256 362" stroke="#E8E0D5" stroke-width="4" stroke-linecap="round" />

    <!-- Page Text Line Accents (Left) -->
    <line x1="130" y1="195" x2="225" y2="195" stroke="#D1C3B7" stroke-width="6" stroke-linecap="round" />
    <line x1="130" y1="230" x2="225" y2="230" stroke="#D1C3B7" stroke-width="6" stroke-linecap="round" />
    <line x1="130" y1="265" x2="195" y2="265" stroke="#D1C3B7" stroke-width="6" stroke-linecap="round" />

    <!-- Page Text Line Accents (Right) -->
    <line x1="287" y1="195" x2="382" y2="195" stroke="#E0D4C8" stroke-width="6" stroke-linecap="round" />
    <line x1="287" y1="230" x2="382" y2="230" stroke="#E0D4C8" stroke-width="6" stroke-linecap="round" />
    <line x1="287" y1="265" x2="340" y2="265" stroke="#E0D4C8" stroke-width="6" stroke-linecap="round" />

    <!-- Exchange Circular Arrows Badge (Share Emblem) -->
    <circle cx="256" cy="275" r="44" fill="#2C1810" />
    
    <!-- Exchange Arrows -->
    <path d="M242 260 L270 260 M262 253 L270 260 L262 267" stroke="#FAF7F2" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M270 290 L242 290 M250 283 L242 290 L250 297" stroke="#FAF7F2" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>